<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial-scale=1.0">
    <meta name="Description" content="My roadmap.sh Photo Showcase exercise.">
    <meta name="robots" content="index, follow">
    <title>Photo Showcase</title>
    <meta property="og:title" content="Photo Showcase">
    <meta property="og:description" content="My roadmap.sh Photo Showcase exercise's Home">
    <meta property="og:image" content="https://example.com">
    <meta property="og:url" content="https://localhost:3000">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="My roadmap.sh Photo Showcase">
    <meta property="og:locale" content="en_FI">
    <meta property="og:image:alt" content="Example image with nothing to show for">
    <link rel="icon" type="image/png" href="non-existing-favicon.ico">
</head>

<body>
    <header>
        <h1>Photo Showcase</h1>
    </header>
    <main>
        <h2>Images without captions</h2>
        <p><img src="https://free-images.com/lg/2944/hair_bracelet_beautiful_beauty_0.jpg" width="800" height="600"
                alt="Picture of a girl saluting with a hat"></p>
        <p><img src="https://free-images.com/lg/6126/japanese_squirrel_squirrel_63152.jpg" width="800" height="600"
                alt="Picture of a squirrel leaning onto a tree root."></p>
        <p><img src="https://free-images.com/lg/d96f/dawn_sunset_building_sunrise.jpg" width="800" height="600"
                alt="Picture of a windmill at dawn"></p>
        <p><img src="https://free-images.com/or/4d64/divider_ornamental_line_decorative.jpg" width="100%" height="24"
                alt=""></p>
        <h2>Images with captions</h2>
        <p>
        <figure>
            <img src="https://free-images.com/lg/82ce/business_graph_chart.jpg" width="500" height="400"
                alt="Picture of a rising graph">
            <figcaption>The graph has risen by 70 %</figcaption>
        </figure>
        </p>
        <p>
        <figure>
            <img src="https://free-images.com/or/d713/worldwarii_militarydeaths_allies_piechar.jpg" width="500"
                height="400" alt="Piechart showing Allies World War II military death share.">
            <figcaption>Soviet Union covers 65 % of all military deaths in World War II.</figcaption>
        </figure>
        </p>
        <p>
        <figure>
            <img src="https://free-images.com/lg/958f/pie_chart_forty_percent.jpg" width="500" height="400"
                alt="Piechart showing 40 % red and 60 % blue.">
            <figcaption>40 % of the feedback was negative.</figcaption>
        </figure>
        </p>
        <p><img src="https://free-images.com/or/4d64/divider_ornamental_line_decorative.jpg" width="100%" height="24"
                alt=""></p>
        <h2>The video</h2>
        <video
            src="https://video-previews.elements.envatousercontent.com/1daffa59-f6f0-4ca4-9d4b-d3b993d7d39a/watermarked_preview/watermarked_preview.mp4"
            controls width="800" height="600"
            poster="https://free-images.com/or/3287/cocktail_bartender_liquor_barman.jpg">
            Your browser does not support video playback.
        </video>
    </main>
    <footer>
        <p>&copy; 2026 me, except for the images and videos.</p>
    </footer>
</body>

</html>
