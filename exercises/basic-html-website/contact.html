    <main>
        <p>I'd love to hear your feedback!</p>
        <form action="/contact" method="post" name="contact">
            <p><label for="name">Name:</label><br>
            <input id="name" type="text" name="name" required placeholder="John Doe"></p>
            <p><label for="email">Email:</label><br>
            <input id="email" type="email" name="email" required placeholder="john.doe@example.com"></p>
            <p><label for="phone">Phone:</label><br>
            <input id="phone" type="tel" name="phone" placeholder="123 456 7890"></p>
            <p><label for="message">Message:</label><br>
            <textarea id="message" name="message" required rows="4" placeholder="Your message goes here"></textarea></p>
            <p><input type="submit" value="Submit"></p>
        </form>
    </main>
